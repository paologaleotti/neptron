# cargo-deny configuration. T0 runs `cargo deny check licenses bans sources`.

[graph]
all-features = true

[licenses]
# NEPTRON source is MIT OR Apache-2.0. Dependencies must carry a permissive
# licence. A copyleft licence needs a decision and an ADR first.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
# The list is a policy for future dependencies, so unused entries are expected.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
