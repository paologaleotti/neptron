# The SD card image of the Raspberry Pi: an MBR partition table with the
# FAT boot partition, the EROFS root and the ext4 state partition. The
# disk signature gives the partition UUIDs of the kernel command line in
# cmdline.txt; post-image.sh puts the signature of the build variant in
# place of @SIGNATURE@.
#
# The firmware reads only partition 1. It starts at 4 MiB, and every size
# is a multiple of 4 MiB, so each partition starts on a 4 MiB boundary,
# the erase block of common SD cards.
#
# The image has no share partition. The first boot makes it from the free
# space of the card (S06neptron-storage) as /dev/mmcblk0p4, as the
# definition asks.

image boot.vfat {
	vfat {
		label = "NEPTRONBOOT"
		extraargs = "-F 32"
		file bootcode.bin {
			image = "boot-part/bootcode.bin"
		}
		file start.elf {
			image = "boot-part/start.elf"
		}
		file fixup.dat {
			image = "boot-part/fixup.dat"
		}
		file config.txt {
			image = "boot-part/config.txt"
		}
		file cmdline.txt {
			image = "boot-part/cmdline.txt"
		}
		file Image {
			image = "boot-part/Image"
		}
		file bcm2710-rpi-3-b.dtb {
			image = "boot-part/bcm2710-rpi-3-b.dtb"
		}
		file bcm2710-rpi-3-b-plus.dtb {
			image = "boot-part/bcm2710-rpi-3-b-plus.dtb"
		}
		file bcm2710-rpi-zero-2-w.dtb {
			image = "boot-part/bcm2710-rpi-zero-2-w.dtb"
		}
		file overlays {
			image = "boot-part/overlays"
		}
		file LICENCES.txt {
			image = "boot-part/LICENCES.txt"
		}
		file legal {
			image = "boot-part/legal"
		}
	}
	size = 128M
}

image neptron-rpi-arm64.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = @SIGNATURE@
	}

	partition boot {
		partition-type = 0xc
		bootable = "true"
		image = "boot.vfat"
		offset = 4M
	}

	partition root {
		partition-type = 0x83
		image = "rootfs.erofs"
		size = 384M
	}

	partition state {
		partition-type = 0x83
		image = "state.ext4"
	}
}
