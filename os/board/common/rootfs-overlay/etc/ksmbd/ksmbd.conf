; The network share of NEPTRON: the share partition /share, open to guests
; on the local network, read-write. docs/spec/network-share.md has the
; reasons and the attack surface. The file is on the read-only root.

[global]
	netbios name = NEPTRON
	server string = NEPTRON
	workgroup = WORKGROUP
	; SMB1 is never served.
	server min protocol = SMB2_10
	server signing = auto
	; Every client is a guest, with or without a user name: there is no
	; user database. A guest works as the user nobody, which owns the
	; share partition and nothing else.
	map to guest = bad user
	guest account = nobody
	; No interfaces list: the server listens on each interface that is up
	; or comes up later.
	bind interfaces only = no
	max connections = 16

[share]
	comment = NEPTRON games and BIOS
	path = /share
	guest ok = yes
	read only = no
	browseable = yes
	; exFAT has no extended attributes.
	store dos attributes = no
