# The USB image of the PC: one disk image that boots with BIOS and UEFI.
#
# The partition table is MBR, so the BIOS boot code of GRUB sits in the gap
# before the first partition, and UEFI finds GRUB on the FAT partition as
# removable media. The disk signature gives the partition UUIDs of the
# kernel command line in grub.cfg; post-image.sh puts the signature of the
# build variant in place of @SIGNATURE@.
#
# The image has no share partition. The first boot makes it from the free
# space of the stick (S06neptron-storage), as the definition asks.

image boot.vfat {
	vfat {
		label = "NEPTRONBOOT"
		file EFI {
			image = "boot-part/EFI"
		}
		file boot {
			image = "boot-part/boot"
		}
		file bzImage {
			image = "bzImage"
		}
		file legal {
			image = "boot-part/legal"
		}
		file LICENCES.txt {
			image = "boot-part/LICENCES.txt"
		}
	}
	size = 64M
}

image neptron-x86_64.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = @SIGNATURE@
	}

	# The GRUB boot sector. The hole keeps the partition table.
	partition mbr {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	# The GRUB core image, in the gap before the first partition.
	partition grub {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition boot {
		partition-type = 0xc
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}

	partition root {
		partition-type = 0x83
		image = "rootfs.erofs"
		size = 384M
	}

	partition state {
		partition-type = 0x83
		image = "state.ext4"
	}
}
