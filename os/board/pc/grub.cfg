# GRUB configuration of the PC image, for BIOS and UEFI. No menu and no
# wait. GRUB loads no video module, so it sets no display mode. The root
# filesystem is partition 2 of the disk with the signature of the build
# variant; post-image.sh puts it in place of @SIGNATURE@.
# usbcore.old_scheme_first=1: some controllers, such as the Mad Catz PS3
# FightStick TE (0738:8838), give no input after the default USB
# enumeration. The scheme is chosen before Linux reads the device
# descriptor, so no per-device quirk can select it.
set default=0
set timeout=0

menuentry "NEPTRON" {
	linux /bzImage root=PARTUUID=@SIGNATURE@-02 rootfstype=erofs ro rootwait quiet console=ttyS0,115200 panic=10 usbcore.old_scheme_first=1
}
