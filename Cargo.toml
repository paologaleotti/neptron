[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
libloading = "0.9.0"
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.154"
# Pinned to one exact release: the crate still makes breaking releases. The
# system SDL3 library is found with pkg-config and linked dynamically.
sdl3 = { version = "=0.22.1", default-features = false }
thiserror = "2.0.21"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"

# Compile time has priority over run-time speed in development.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 0

# Abort is also the safe behaviour across the libretro FFI: a panic must not
# unwind into C code.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
