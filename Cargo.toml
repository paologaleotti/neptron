[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
cc = "1.11.1"
drm = "0.15.0"
# The raw atomic ioctl of neptron-kms, feature `kms`: it takes the object,
# property and value ids as slices, so a page flip can use fixed arrays and
# allocate nothing. The version is the one drm 0.15 uses.
drm-ffi = "0.9.1"
# GBM buffers of neptron-kms, feature `kms`: the raw libgbm binding. The
# `gbm` crate allocates an Arc for each locked buffer, once per frame, and
# its handle is a C union anyway. Linked with -lgbm, so only a Linux build
# with the feature needs libgbm.
gbm-sys = "0.4.0"
# Linux only: keyboards through the kernel evdev interface. No async
# features.
evdev = { version = "0.13.2", default-features = false }
# OpenGL ES calls for the renderer of neptron-gfx, feature `gles`. It loads
# every GL function through eglGetProcAddress and links no GL library.
glow = "0.18.0"
# EGL for the renderer of neptron-gfx, feature `gles`. `dynamic` opens
# libEGL.so.1 at run time, so no build links EGL and the guest build needs no
# EGL in its sysroot.
khronos-egl = { version = "6.0.0", default-features = false, features = ["1_5", "dynamic"] }
libloading = "0.9.0"
# Raw deflate for zip content. Pure Rust, one dependency.
miniz_oxide = "0.9.1"
# Default features off: the FFT resampler and its dependencies are not
# needed for a variable ratio.
rubato = { version = "5.0.1", default-features = false }
# poll(2) for the bounded waits of neptron-kms (page flip, writeback fence),
# feature `kms`. Already in the build through drm.
rustix = { version = "1.1.6", default-features = false, features = ["std", "event"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.154"
# Lets xtask stop its QEMU child on SIGTERM and SIGHUP without unsafe code.
signal-hook = { version = "0.4.6", default-features = false }
# Pinned to one exact release: the crate still makes breaking releases. The
# system SDL3 library is found with pkg-config and linked dynamically.
sdl3 = { version = "=0.22.1", default-features = false }
thiserror = "2.0.21"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"

# Compile time has priority over run-time speed in development.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 0

# Abort is also the safe behaviour across the libretro FFI: a panic must not
# unwind into C code.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
