[package]
name = "neptron-input"
description = "Input: SDL3 gamepads, evdev keyboards, RetroPad mapping and hotplug"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Off by default: the headless build (T0 to T2) compiles no SDL3, EGL or KMS code.
sdl3 = []
evdev = []

[dependencies]
neptron-types = { path = "../neptron-types" }
# The code standards make each crate own a thiserror enum.
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The backend traits and the simulated clock: the hotkey tests run in
# simulated time, and scripted input enters as real input does.
neptron-backend = { path = "../neptron-backend" }
neptron-testkit = { path = "../neptron-testkit" }
