[package]
name = "neptron-input"
description = "Input: SDL3 gamepads, evdev keyboards, RetroPad mapping and hotplug"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Off by default: the headless build (T0 to T2) compiles no SDL3, EGL or KMS code.
sdl3 = ["dep:sdl3"]
evdev = ["dep:evdev"]

[dependencies]
neptron-backend = { path = "../neptron-backend" }
neptron-types = { path = "../neptron-types" }
# The gamepad and joystick subsystems only. No unsafe function of the crate
# is called.
sdl3 = { workspace = true, optional = true }
# The code standards make each crate own a thiserror enum.
thiserror.workspace = true

# The evdev crate reads Linux input devices, so it exists only on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
# The simulated clock and scripted input: the hotkey tests run in simulated
# time, and scripted input enters as real input does.
neptron-testkit = { path = "../neptron-testkit" }

# Reads a real gamepad, so it is a program and not a test.
[[example]]
name = "gamepads"
required-features = ["sdl3"]
