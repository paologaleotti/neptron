[package]
name = "neptron-window"
description = "Desktop window backend for development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Off by default: the headless build (T0 to T2) compiles no SDL3, EGL or KMS code.
sdl3 = ["dep:sdl3"]

[dependencies]
neptron-backend = { path = "../neptron-backend" }
neptron-gfx = { path = "../neptron-gfx" }
neptron-safety = { path = "../neptron-safety" }
neptron-types = { path = "../neptron-types" }
# `unsafe_textures` removes the lifetime that ties a texture to its creator,
# so that one struct can own the renderer and its texture. The crate calls no
# unsafe function of `sdl3`.
sdl3 = { workspace = true, optional = true, features = ["unsafe_textures"] }
# The code standards make each crate own a thiserror enum.
thiserror.workspace = true

[lints]
workspace = true
