[package]
name = "neptron-audio"
description = "Audio out: rubato resampler, dynamic rate control and the SDL3 sink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Off by default: the headless build (T0 to T2) compiles no SDL3, EGL or KMS code.
sdl3 = []

[dependencies]
neptron-backend = { path = "../neptron-backend" }
# The resampler with a variable ratio that dynamic rate control needs.
rubato.workspace = true
# The code standards make each crate own a thiserror enum.
thiserror.workspace = true

[dev-dependencies]
neptron-testkit = { path = "../neptron-testkit" }

[lints]
workspace = true
