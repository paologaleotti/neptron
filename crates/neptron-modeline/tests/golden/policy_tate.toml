# The TATE goldens: the reference boards of tests/integration/arcade_table.rs
# (BOARDS, Appendix B of docs/spec/arcade.md) and the menu source, as
# display sources on a screen turned on its side (docs/spec/tate.md,
# section 5). Checked by tests/integration/policy_tate.rs.
#
# Each board case is "<board> <display> s<S>", with S the screen
# orientation, 90 or 270, and the game override at Auto. The source is
# Orientation::display_source of the board: the frame as drawn, with its
# rotation set to the game turn R = (G - S) mod 360. The value has the
# format of policy.toml: the winner of decide() with the arcade settings
# of arcade_table.rs (style auto, refresh exact, the GPU's horizontal
# strategy) after choose() with neptron_safety::validate. The policy does
# not change for TATE; only its source carries the turn.
#
# Each menu case is "menu <display> s<S>": the menu source (320x240,
# 60 Hz, 4:3, R0) as a display source, with the default settings, then
# "ui WxH+X+Y filter", the place of the turned 240x320 canvas in the
# winner's mode (ui_dest_turned). These cases are data. They record the
# answer of the policy for the turned menu source, and decide nothing
# about the mode of the turned menu, which is an open question (T3 of the
# spec).
#
# Where the values come from: computed by the policy with Switchres at
# commit 87d93d8a0f, recorded on macOS arm64. No source independent of the
# policy gives them. Each value was checked for sense against the spec: a
# vertical board at S = 90 or 270 gives the decision of its raster at R0
# (DoDonPachi is 320x240p at 57.55 Hz on generic_15, as Power Instinct 2
# at S = 0), a horizontal board is across the lines with the rules of a
# turned source, and the turned canvas of the menu is 320 lines 1:1 on a
# CRT and a TV and 3x on the 1080p panel (section 6.2).
#
# A changed value is a change in what NEPTRON sends to a display. Check it
# against the rules in crates/neptron-modeline/README.md and
# docs/spec/tate.md before you change this file.

