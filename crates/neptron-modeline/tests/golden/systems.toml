# Timing check 1: the golden list of systems.
#
# Each [[system]] is the source geometry of a real system: the active size
# and the refresh in millihertz, with the scan type and the rotation.
# `origin` gives the clock and the totals that the refresh comes from. These
# are the common figures for each system (hardware documentation and MAME
# drivers). They are inputs: an error in one changes the case, not the
# check.
#
# Each [[case]] runs one system against one preset of data/monitors, with
# the default Settings of neptron-modeline (doublescan off) and a GPU with no
# pixel clock floor that allows interlace, unless the case says otherwise.
# Together the cases cover all 25 presets.
#
# Where the expected values come from: they are recorded from Switchres at
# commit 09272ac24640daee45f5be15b1b856ecd220dda2. No source independent of
# Switchres gives these modelines. Each value is the output of the upstream
# standalone program, built from the same commit and not from this crate:
# the comment in each case is its command line, and `expect` is the
# timing part of its "Modeline" line. The program reads the presets from
# its own table in monitor.cpp and selects the mode in its own get_mode, so
# a match also checks the shim and the integer conversion of this crate.
# Recorded on macOS arm64, Apple clang 21, -ffp-contract=off.
#
# A changed value is a change in the modelines that NEPTRON sends to a CRT.
# Check it against the standalone program before you change this file. See
# crates/neptron-modeline/README.md.

