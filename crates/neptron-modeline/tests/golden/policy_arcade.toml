# The arcade goldens: real arcade boards through the ODREN policy on every
# display of tests/integration/arcade_table.rs (every preset of
# data/monitors, four EDID tubes, five flat panels, NTSC and PAL).
# Checked by tests/integration/policy_golden.rs.
#
# Each case is "<board> <display>". The value has the format of
# policy.toml: the winner of decide() with the default settings (style
# auto, refresh exact, the GPU's horizontal strategy) after choose() with
# neptron_safety::validate. The boards, their sizes and their rates, with
# the driver each value comes from, are in arcade_table.rs (BOARDS).
#
# Only the cells whose winner follows the arcade rule of
# docs/spec/arcade.md (section 11, as the owner decided it on 2026-11-16)
# are here, with the cells that carry an allowed reason: no exact mode
# exists on the profile, the profile declares no interlace, a range has one
# line rate only, or the overscan crop hides edge lines. The test finds
# the cells with that rule (`arcade_table::cell`), so the file must hold
# exactly those cells. A cell that breaks the rule is work for the policy,
# never blessed here.
#
# Where the values come from: computed by the policy with Switchres at
# commit 09272ac24640daee45f5be15b1b856ecd220dda2, recorded on macOS
# arm64. No source independent of the policy gives them. Each value was
# checked for sense against the rule: the line rate is in a range of the
# profile, the game's lines are its height times the scale, the game's
# rectangle is centred and has the game's shape.
#
# A changed value is a change in what NEPTRON sends to a display. Check it
# against the rules in crates/neptron-modeline/README.md and the arcade
# rule before you change this file.

