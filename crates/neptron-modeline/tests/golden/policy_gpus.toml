# Timing check 4: the per-GPU goldens. Each entry of
# data/hardware/matrix.toml, and the unknown-GPU values of
# neptron-platform, on generic_15 and on the EDID profile, for eight
# systems. Checked by tests/integration/policy_golden.rs.
#
# Each case is "<gpu> <profile> <system>". The value has the format of
# policy.toml. The width shows the horizontal strategy of the GPU: a GPU
# with a 25 MHz floor gets the smallest whole multiple of the game width
# whose pixel clock reaches it (the super widths for Intel), a GPU with no
# floor gets the game width. A GPU without interlace gets no 480i.
#
# pi_vc4_composite gives "none" on every case: these are CRT profiles, its
# pixel clock is fixed at 13.5 MHz, Switchres does not calculate for a
# fixed clock, and the validator refuses every other clock. A composite
# output takes a TV profile instead; policy_tv.toml has its goldens.
#
# Where the values come from: computed by the policy with Switchres at
# commit 09272ac24640daee45f5be15b1b856ecd220dda2, recorded on macOS
# arm64, and checked for sense as policy.toml describes.

