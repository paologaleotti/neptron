# The wider goldens: consoles, handhelds, computers and the rate extremes
# of the arcade boards through the ODREN policy on every display of
# tests/integration/arcade_table.rs. Checked by
# tests/integration/policy_golden.rs.
#
# Each case is "<source> <display>", in the format of policy.toml, with
# the default settings (an arcade source with PolicySettings::arcade).
# The sources, their sizes, rates and display aspects, and where each
# value comes from, are in arcade_table.rs (SOURCES). A system of
# systems.toml keeps its geometry and 4:3, and the test
# the_wider_table_agrees_with_the_console_goldens holds it to policy.toml.
#
# Only the cells that follow the video rule of docs/spec/arcade.md
# (section 11) are here, with the cells that carry an allowed reason: no
# exact mode exists on the profile, the profile declares no interlace, a
# range has one line rate or one field rate only, the overscan crop hides
# edge lines, or a console on a TV keeps the console width rule. The test
# finds the cells with that rule, so the file must hold exactly those.
#
# Where the values come from: computed by the policy with Switchres at
# commit 09272ac24640daee45f5be15b1b856ecd220dda2, recorded on macOS
# arm64. No source independent of the policy gives them; the invariant
# sweep (policy_sweep.rs) checks the rules they follow.

