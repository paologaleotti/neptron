# The panel goldens with the scanlines of a flat panel off and on: each
# system of systems.toml (at 4:3) on the 1440p and 4K panels of
# tests/integration/arcade_table.rs. Checked by
# tests/integration/policy_golden.rs.
#
# Each case is "<system> <panel> scanlines <off|on>", in the format of
# policy.toml. The renderer draws scanlines only at a whole vertical scale
# of 2 or more, so with them on (PolicySettings::panel_scanlines) the
# panel takes the largest whole multiple at every scale; with them off a
# scale of 4.0 or more fills the height (PANEL_FILL_MIN_SCALE_MILLI).
#
# Where the values come from: computed by the policy, recorded on macOS
# arm64. Each value was checked for sense: with scanlines on the game's
# height is a whole multiple of its lines, centred; with them off a scale
# of 4 or more fills the 1440 or 2160 lines at the game's aspect.

