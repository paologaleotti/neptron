# The picture mode goldens: each value of display.style (auto, native,
# 2x, 3x, 4x, sharp, speed, fit) for a set of sources on one display of
# each class: generic_15 (15 kHz), arcade_25 (25 kHz), arcade_31
# (31 kHz), d9800 (multi-range), edid_30_70 (a multi-sync EDID tube),
# tv_ntsc and tv_pal (the TV standards on the composite encoder of the
# Raspberry Pi) and panel_1080 (a flat panel with a 50 Hz mode). Checked
# by tests/integration/policy_golden.rs.
#
# Each case is "<source> <display> <mode>", in the format of policy.toml.
# The sources are those of tests/integration/arcade_table.rs, with their
# own settings (an arcade board is marked as one).
#
# Where the values come from: computed by the policy, recorded on macOS
# arm64. The auto cells are the cells of policy_sources.toml, which the
# test checks. Each other cell was checked for sense against the rules of
# docs/spec/video-policy-cases.md, section 8: sharp and speed differ from
# auto only where the speed rule of V6 decides (dos_640x400 on
# generic_15: speed takes the fit at 65 Hz); fit drops the small and the
# interlaced 1:1 exact pictures of a progressive game, fits it into the
# most progressive lines at the game's rate or at the window rate
# (md_pal_h40 and snes_ntsc on arcade_25), and keeps the interlaced mode
# of md_448i. No progressive source gets an interlaced fit in this file:
# the case of no progressive lines at either rate has no cell here. On
# panel_1080 native and the multiples give that factor or the largest
# smaller one, sharp the largest whole multiple and fit the fill.

