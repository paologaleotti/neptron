# The TV goldens: each system of systems.toml on the TV profiles tv_ntsc
# (525 lines) and tv_pal (625 lines), with each value of tv_width, on the
# composite encoder of the Raspberry Pi (pi_vc4_composite of
# data/hardware/matrix.toml). Checked by tests/integration/policy_golden.rs.
#
# Each case is "<system> <profile> <tv_width>". The value has the format
# of policy.toml: rung, refresh kind, mode, line rate, field rate, the
# game's rectangle in the 720 samples and the lines of the mode, and the
# filter; then "crop N" when N source lines are hidden at each edge, and
# "speed" when the game rate and the field rate differ by more than
# TV_SPEED_SILENT_PPM, so the game speed changes and the alert shows.
#
# Every system has the display aspect 4:3, as in policy.toml. The
# handhelds (game_boy, game_gear, gba, wonderswan) are left out: their
# aspect is not 4:3, and the repository holds no per-system aspect.
# tests/integration/policy_tv.rs checks them with their real aspect.
#
# Where the values come from: computed by the policy, with no Switchres.
# The modes are the four table modes of neptron-types (ADR 0012). Each
# value was checked by hand against the rules of the crate README: the
# lines 1:1 and centred; the console width (644 samples on 525 lines, 650
# on 625) for a 4:3 game of 224 to 240 lines per field; else the aspect
# times the lines times 2.2 (525) or 1.8333 (625) samples; a whole or
# half factor within 3 %; and the speed bound.

