# The policy goldens: each system of systems.toml through the ODREN policy
# on six profiles. Checked by tests/integration/policy_golden.rs.
#
# Each case is "<system> <profile>". The value is the winner of decide()
# with the default settings (style auto, refresh exact, the GPU's
# horizontal strategy) after choose() with neptron_safety::validate: rung,
# refresh kind, mode, line rate, field rate, the game's rectangle in the
# mode (size, then offset) and the filter, then "crop N" when an overscan
# crop hides N source lines at the top and N at the bottom. "none" means no
# proposal validates.
#
# The CRT profiles use a GPU with no pixel clock floor that sends
# interlace, so the width is the game width; the per-GPU widths are in
# policy_gpus.toml. arcade_31 is a 31 kHz arcade monitor with no range
# above 65 Hz. edid_npt_0071 is the profile that neptron-platform
# builds from the EDID of a 30 to 71 kHz, 50 to 160 Hz PC CRT, with its
# 100 MHz pixel clock limit applied to the GPU. panel_1080 is a 1080p
# flat panel with its 60 Hz, 50 Hz and 720p CEA modes.
#
# Where the values come from: computed by the policy with Switchres at
# commit 09272ac24640daee45f5be15b1b856ecd220dda2 (the modelines of the
# solver goldens), recorded on macOS arm64. No source independent of the
# policy gives them. Each value was checked for sense: the line rate is in
# a range of the profile, the field rate is the game's rate to two
# decimals unless the kind says otherwise, the active lines are the game's
# lines times the rung's factor, and the game's rectangle is inside the
# mode, centred when it has borders.
#
# A changed value is a change in what NEPTRON sends to a CRT. Check it
# against the rules in crates/neptron-modeline/README.md before you change
# this file.

