[package]
name = "neptron-libretro"
description = "Safe libretro core host: load a core, environment callbacks, save RAM, core options"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Opens the core as a dynamic library.
libloading.workspace = true
# Inflates deflate entries of zip content.
miniz_oxide.workspace = true
neptron-libretro-sys = { path = "../neptron-libretro-sys" }
neptron-types = { path = "../neptron-types" }
# The code standards make each module own a thiserror enum.
thiserror.workspace = true

[build-dependencies]
# Compiles the C shim for the variadic log callback.
cc.workspace = true

[dev-dependencies]
# The integration tests load the test core and drive it with the fakes.
neptron-testcore = { path = "../neptron-testcore" }
neptron-testkit = { path = "../neptron-testkit" }

[lints]
workspace = true
