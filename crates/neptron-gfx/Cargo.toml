[package]
name = "neptron-gfx"
description = "Renderers for a Scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Off by default: the headless build (T0 to T2) compiles no SDL3, EGL or KMS code.
gles = ["dep:glow", "dep:khronos-egl"]

[dependencies]
neptron-types = { path = "../neptron-types" }
# The code standards make each crate own a thiserror enum.
thiserror.workspace = true
glow = { workspace = true, optional = true }
khronos-egl = { workspace = true, optional = true }

[lints]
workspace = true
