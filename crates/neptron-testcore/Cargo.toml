[package]
name = "neptron-testcore"
description = "A libretro core that follows a script, for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The cdylib is the core that a frontend loads. The rlib lets tests use the
# frame and audio generators.
crate-type = ["cdylib", "rlib"]

[dependencies]
neptron-libretro-sys = { path = "../neptron-libretro-sys" }
# The code standards make each module own a thiserror enum.
thiserror.workspace = true

[dev-dependencies]
# The load test opens the built core as a frontend does.
libloading.workspace = true

[lints]
workspace = true
