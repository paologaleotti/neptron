[package]
name = "neptronctl"
description = "Command-line client: print a modeline, test a mode, self-test, diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Off by default: the headless build (T0 to T2) compiles no KMS code. With
# it, `selftest video` shows its modes on the DRM device.
kms = ["dep:neptron-kms", "neptron-kms/kms", "dep:signal-hook"]

[dependencies]
neptron-backend = { path = "../../crates/neptron-backend" }
neptron-ipc = { path = "../../crates/neptron-ipc" }
# The self-test plans its modes with the policy and validates each one.
neptron-modeline = { path = "../../crates/neptron-modeline" }
# GPU detection, the capability table and the EDID profile of the
# self-test.
neptron-platform = { path = "../../crates/neptron-platform" }
neptron-safety = { path = "../../crates/neptron-safety" }
neptron-types = { path = "../../crates/neptron-types" }
serde.workspace = true
serde_json.workspace = true
# The code standards make each crate own a thiserror enum.
thiserror.workspace = true
# The monitor presets are TOML files on the image.
toml.workspace = true

neptron-kms = { path = "../../crates/neptron-kms", optional = true }
# Sets the stop flag of the self-test on SIGINT, SIGTERM and SIGHUP with no
# unsafe code, as the launcher does.
signal-hook = { workspace = true, optional = true }

[dev-dependencies]
# The fake display and the simulated clock of the self-test tests.
neptron-testkit = { path = "../../crates/neptron-testkit" }

[lints]
workspace = true
