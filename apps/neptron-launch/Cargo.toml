[package]
name = "neptron-launch"
description = "The launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The DRM node check and the standard descriptor limit that the frontend's
# backend applies to the same descriptor. Default features: no DRM code.
neptron-kms = { path = "../../crates/neptron-kms" }
# Clears close-on-exec on the device descriptor and forwards a stop signal
# to the frontend, with no unsafe code.
rustix = { workspace = true, features = ["process"] }
# Sets a flag on SIGTERM and SIGINT with no unsafe code, as xtask does.
signal-hook.workspace = true
# The code standards make each crate own a thiserror enum.
thiserror.workspace = true

[lints]
workspace = true
