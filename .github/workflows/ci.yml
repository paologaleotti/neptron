# The checks of NEPTRON. docs/ci.md describes what runs when, the caches,
# the measured times and the settings of the repository.
#
# Every job of a pull request starts at once; no job waits for another.
# Path filters apply to pull requests only: main and the nightly run do
# everything, because main is the only source of the caches.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    # Nightly, at a quiet hour for the shared runners.
    - cron: "23 2 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs of main are never
# cancelled: a cold image build takes hours.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # Incremental data makes the cache large and gives no benefit in a clean runner.
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Debug info makes the cache large and the links slow, and no CI step
  # reads it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lint:
    name: lint (T0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEPTRON_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - name: Restore the Cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-lint-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-lint-
      - name: Verify tier 0
        run: cargo xtask verify --tier 0
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-lint
          retention-days: 14
          path: target/verify/report.json
      - name: Save the Cargo cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test:
    name: test-${{ matrix.host }} (T0 to T2)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            runner: ubuntu-24.04
            jobs: "4"
          - host: macos
            runner: macos-15
            jobs: "3"
    env:
      NEPTRON_BUILD_JOBS: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find changed paths
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE-*'
      - name: Decide
        id: run
        env:
          CODE: ${{ steps.changes.outputs.code }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$CODE" != true ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Documents only: lint runs, the tests do not." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the pinned toolchain
        if: steps.run.outputs.go == 'true'
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: steps.run.outputs.go == 'true'
        with:
          tool: cargo-nextest@0.9.151,cargo-deny@0.20.2
      - name: Restore the Cargo cache
        id: cache
        if: steps.run.outputs.go == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-test-
      - name: Verify tier 2
        if: steps.run.outputs.go == 'true'
        run: cargo xtask verify --tier 2
      # The tier 1 golden test names the scenes that differ; this writes the
      # expected, actual and diff pictures of each one.
      - name: Write the golden diff images
        if: failure() && steps.run.outputs.go == 'true'
        run: cargo xtask golden || true
      - name: Upload the report and the golden diffs
        if: failure() && steps.run.outputs.go == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-${{ matrix.host }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            target/verify/report.json
            target/ui/golden
            target/tmp/goldens-actual
      - name: Save the Cargo cache
        if: github.ref == 'refs/heads/main' && steps.run.outputs.go == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  images:
    name: images
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read

  # The one check to make required: it fails when any job above failed or
  # was cancelled, and passes when they passed or were skipped by a filter.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarise
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            exit 1
          fi
