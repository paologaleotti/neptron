# The OS images and the tier 3 checks in QEMU.
#
# ci.yml calls this workflow for every event. A pull request runs it only
# when it changes the OS, the device crates or this workflow. docs/ci.md
# describes the design, the measured times and the limits.
#
# Licence rules that this workflow enforces:
# - OP-070: the licence of the 15 kHz kernel patch set is not clear, so no
#   image, kernel or Buildroot output with those patches may be distributed.
#   Workflow artifacts and caches of a public repository can be read by
#   others, so every build here that uploads or caches anything uses
#   --no-kernel-15khz. The job "kernel-15khz" builds the patched kernel only
#   to prove that the patches still apply and build; it uploads nothing and
#   saves no cache.
# - OP-054: the images hold Snes9x and Genesis Plus GX (non-commercial
#   licences). An uploaded image carries the licence manifest and the
#   licence texts, and the GPL sources go in an artifact beside it. There is
#   no GitHub Release: artifacts with a short retention only.

name: Images

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Change this value to force a cold Buildroot build of every target.
  BASE_EPOCH: "1"
  # Every Buildroot data directory lives here, outside the Docker data root,
  # so the runner user can cache it and tar it.
  WORK: /mnt/neptron

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find changed paths
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            device:
              - 'os/**'
              - 'Dockerfile'
              - '.github/image-targets.json'
              - '.github/workflows/images.yml'
              - 'xtask/src/os.rs'
              - 'xtask/src/os/**'
              - 'apps/neptron-launch/**'
              - 'crates/neptron-kms/**'
              - 'crates/neptron-gfx/**'
              - 'crates/neptron-input/**'
              - 'crates/neptron-audio/**'
              - 'crates/neptron-libretro/**'
              - 'crates/neptron-libretro-sys/**'
      - name: Decide the targets
        id: decide
        env:
          DEVICE: ${{ steps.changes.outputs.device }}
          EVENT: ${{ github.event_name }}
          WANTED: ${{ github.event.inputs.images }}
        run: |
          matrix=$(jq -c '{include: [.targets[] | select(.enabled)]}' .github/image-targets.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = pull_request ] && [ "$DEVICE" != true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change to the OS or the device crates: no image build." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$WANTED" = false ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The manual run asked for no image build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: image ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Runs of main and the nightly run wait for each other per target, so a
    # second cold build never starts while the first one is still running.
    concurrency:
      group: image-${{ matrix.name }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGES: ${{ format('{0}/.cache/neptron/buildroot/images/{1}', '/home/runner', matrix.images_dir) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history gives each file of os/ the time of its last
          # commit, see "Give os/ its commit times".
          fetch-depth: 0

      - name: Show the runner
        run: |
          nproc; free -g; df -h; uname -a
          ls -l /dev/kvm || echo "no /dev/kvm"

      # The runner image holds about 30 GB of SDKs that this job never uses.
      # They are deleted in the background while the job installs its tools.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /opt/az \
            /usr/local/julia* /usr/lib/jvm /opt/microsoft /opt/google &
          docker image prune --all --force > /dev/null &
          wait
          if ! mountpoint -q /mnt || [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -lt 50 ]; then
            echo "WORK=/home/runner/neptron-work" >> "$GITHUB_ENV"
          fi
          df -h

      - name: Install QEMU and enable KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            qemu-system-x86 qemu-system-arm qemu-utils ovmf zstd
          # QEMU looks for the EDK II flash images under their QEMU names;
          # Ubuntu ships them as OVMF files.
          if [ ! -e /usr/share/qemu/edk2-x86_64-code.fd ] && [ -e /usr/share/OVMF/OVMF_CODE_4M.fd ]; then
            sudo ln -s /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/qemu/edk2-x86_64-code.fd
            sudo ln -s /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/qemu/edk2-i386-vars.fd
          fi
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "no KVM: QEMU emulates the CPU"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Make compares the stamps of the restored output with the files of
      # os/ (kernel and BusyBox fragments). A fresh checkout gives every file
      # the current time, which would rebuild the kernel each run. The time
      # of the last commit of each file keeps a file that did not change
      # older than the stamps, and a file that changed newer.
      - name: Give os/ its commit times
        run: |
          git log --format='@%ct' --name-only -- os | awk '
            /^@/ { t = substr($0, 2); next }
            NF && !($0 in seen) { seen[$0] = t; print t, $0 }' |
          while read -r t f; do
            if [ -e "$f" ]; then touch -m -d "@$t" "$f"; fi
          done

      - name: Compute the cache keys
        id: keys
        env:
          DEFCONFIG: ${{ matrix.defconfig }}
          FRAGMENTS: ${{ join(matrix.fragments, ' ') }}
          TARGET: ${{ matrix.name }}
        run: |
          files="Dockerfile os/configs/$DEFCONFIG"
          for f in $FRAGMENTS; do files="$files os/configs/$f"; done
          files="$files $(git ls-files os/patches 'os/package/libretro-*' | tr '\n' ' ')"
          base=$({ echo "$BASE_EPOCH"; for f in $files; do echo "$f"; sha256sum < "$f"; done; } \
            | sha256sum | cut -c1-16)
          dl=$(git ls-files '*.hash' 'os/configs/*' Dockerfile | xargs sha256sum | sha256sum | cut -c1-16)
          echo "base=br-base-$TARGET-$base" >> "$GITHUB_OUTPUT"
          echo "partial=br-partial-$TARGET-$base" >> "$GITHUB_OUTPUT"
          echo "prefix=br-base-$TARGET-" >> "$GITHUB_OUTPUT"
          echo "dl=br-dl-$TARGET-$dl" >> "$GITHUB_OUTPUT"
          echo "Base key: br-base-$TARGET-$base, from: $files"

      - name: Make the Docker volumes
        env:
          TARGET: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
          BUILD_ARGS: ${{ join(matrix.build_args, ' ') }}
        run: |
          # The output volume is the --output name, or the arch.
          out=$(echo " $BUILD_ARGS " | sed -n 's/.* --output \([^ ]*\) .*/\1/p')
          out=${out:-$ARCH}
          echo "OUT_VOLUME=neptron-br-out-$out" >> "$GITHUB_ENV"
          sudo mkdir -p "$WORK"
          sudo chown "$(id -u):$(id -g)" "$WORK"
          for v in neptron-br-dl neptron-br-ccache "neptron-br-out-$out" "neptron-cross-$ARCH"; do
            mkdir -p "$WORK/$v"
            docker volume create --driver local --opt type=none --opt o=bind \
              --opt device="$WORK/$v" "$v" > /dev/null
          done
          echo "OUT_DIR=$WORK/neptron-br-out-$out" >> "$GITHUB_ENV"

      - name: Restore the Buildroot downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dl
        with:
          path: ${{ env.WORK }}/neptron-br-dl
          key: ${{ steps.keys.outputs.dl }}
          restore-keys: br-dl-${{ matrix.name }}-

      # The base is the Buildroot output of a full build for this key: the
      # toolchain, LLVM, Mesa, the kernel and every other package, with the
      # object files removed. It is a workflow artifact, because it is larger
      # than the Actions cache of the repository can hold beside the Cargo
      # caches. Only artifacts of this repository, from main or from this
      # branch, are trusted: a fork can upload an artifact with any name.
      - name: Find the base
        id: base
        env:
          BASE: ${{ steps.keys.outputs.base }}
          PARTIAL: ${{ steps.keys.outputs.partial }}
          PREFIX: ${{ steps.keys.outputs.prefix }}
          REPO_ID: ${{ github.repository_id }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          newest() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100$1" --jq "
              .artifacts[]
              | select(.expired | not)
              | select(.workflow_run.head_repository_id == $REPO_ID)
              | select(.workflow_run.head_branch == \"main\" or .workflow_run.head_branch == \"$BRANCH\")
              | select(.name | startswith(\"$2\"))
              | \"\(.created_at) \(.workflow_run.id) \(.name)\"" | sort -r | head -n 1
          }
          state=cold
          found=$(newest "&name=$BASE" "$BASE")
          if [ -n "$found" ]; then
            state=complete
          else
            found=$(newest "&name=$PARTIAL" "$PARTIAL")
            if [ -n "$found" ]; then
              state=partial
            else
              # An older base: on a pull request it is built on further,
              # which is quick but not clean. Elsewhere only its compiler
              # cache is used, and the build is cold.
              found=$(newest "" "$PREFIX")
              if [ -n "$found" ]; then
                if [ "$EVENT" = pull_request ]; then state=older; else state=ccache; fi
              fi
            fi
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ -n "$found" ]; then
            set -- $found
            echo "run=$2" >> "$GITHUB_OUTPUT"
            echo "name=$3" >> "$GITHUB_OUTPUT"
          fi
          echo "Base: $state ${found:-none}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the base
        if: steps.base.outputs.name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.base.outputs.name }}
          run-id: ${{ steps.base.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ env.WORK }}/base

      - name: Unpack the base
        if: steps.base.outputs.name != ''
        env:
          STATE: ${{ steps.base.outputs.state }}
        run: |
          start=$(date +%s)
          ls -l "$WORK/base"
          if [ -f "$WORK/base/ccache.tar.zst" ]; then
            zstd -dc "$WORK/base/ccache.tar.zst" | sudo tar --numeric-owner -xpf - -C "$WORK/neptron-br-ccache"
          fi
          if [ "$STATE" != ccache ]; then
            zstd -dc "$WORK/base/out.tar.zst" | sudo tar --numeric-owner -xpf - -C "$OUT_DIR"
          fi
          rm -rf "$WORK/base"
          echo "Unpacked in $(( $(date +%s) - start )) s"
          df -h "$WORK"

      # The container user br has uid 1000. A bind volume keeps the owner of
      # the host directory, and the cache restores files as the runner user.
      - name: Give the volumes to the container user
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          for v in neptron-br-dl neptron-br-ccache "$(basename "$OUT_DIR")" "neptron-cross-$ARCH"; do
            sudo chown -R 1000:1000 "$WORK/$v"
          done

      # The NEPTRON packages build this checkout. Buildroot does not see a
      # change to a local source by itself, so they are rebuilt every time.
      - name: Build the image
        id: build
        timeout-minutes: ${{ matrix.build_minutes }}
        env:
          BUILD_ARGS: ${{ join(matrix.build_args, ' ') }}
          REBUILD: ${{ join(matrix.rebuild, '-rebuild ') }}
        run: |
          start=$(date +%s)
          # shellcheck disable=SC2086
          cargo xtask os build $BUILD_ARGS --jobs "$(nproc)" -- $REBUILD-rebuild
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          echo "Image build: $(( $(date +%s) - start )) s (base: ${{ steps.base.outputs.state }})" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Show the output sizes
        if: ${{ !cancelled() }}
        run: |
          df -h "$WORK"
          sudo du -sh "$OUT_DIR"/* "$WORK"/neptron-br-dl "$WORK"/neptron-br-ccache 2>/dev/null || true
          sudo du -s "$OUT_DIR"/build/* 2>/dev/null | sort -rn | head -25 || true
          ls -l "$IMAGES" || true

      - name: Check the boot with BIOS
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'boot-bios') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: cargo xtask os boot-check --arch ${{ matrix.arch }} --firmware bios

      - name: Check the boot with UEFI
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'boot-uefi') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: cargo xtask os boot-check --arch ${{ matrix.arch }} --firmware uefi

      - name: Check the boot
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'boot') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: cargo xtask os boot-check --arch ${{ matrix.arch }}

      - name: Check the frontend for the guest
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'app') }}
        run: cargo xtask os app-check --arch ${{ matrix.arch }}

      - name: Check KMS on vkms
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'kms') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: cargo xtask kms-check --arch ${{ matrix.arch }}

      - name: Compare the GLES renderer
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'gles') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: cargo xtask gles-compare --arch ${{ matrix.arch }}

      - name: Check the video self-test
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'selftest') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: cargo xtask os selftest-check --arch ${{ matrix.arch }}

      # The SNES and Mega Drive test ROMs are not in the repository (OP-053),
      # and CI never downloads a ROM. Their cases are reported as skipped;
      # every case whose ROM is here must pass.
      - name: Trace the real cores
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'core') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: cargo xtask core-trace --arch ${{ matrix.arch }} --allow-missing-roms

      - name: Upload the check reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            target/os/boot-check
            target/core-trace/actual
            target/qemu/*-console.log

      - name: Collect the image, its checksum and the licence manifest
        if: success() && matrix.upload_image
        env:
          FILES: ${{ join(matrix.image_files, ' ') }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          dist="$WORK/dist/$ARTIFACT"
          mkdir -p "$dist/legal" "$WORK/dist/sources"
          for f in $FILES; do cp "$IMAGES/$f" "$dist/"; done
          sudo cp "$OUT_DIR"/legal-info/*.csv "$OUT_DIR"/legal-info/*.txt "$dist/legal/" 2>/dev/null || true
          sudo cp -r "$OUT_DIR/legal-info/licenses" "$dist/legal/"
          sudo cp -r "$OUT_DIR/legal-info/sources" "$WORK/dist/sources/"
          sudo chown -R "$(id -u):$(id -g)" "$WORK/dist"
          cp os/board/pc/LICENCES.txt "$dist/" 2>/dev/null || true
          cat > "$dist/README.txt" <<EOF
          NEPTRON $ARTIFACT, commit $GITHUB_SHA, CI run $GITHUB_RUN_ID.
          Built without the 15 kHz kernel patch set (OP-070).
          The image holds Snes9x and Genesis Plus GX, which allow non-commercial
          use only: never sell this image. legal/ holds the licence manifest and
          the licence texts. The sources of the GPL and LGPL packages are in the
          artifact $ARTIFACT-sources of the same run.
          EOF
          (cd "$dist" && sha256sum $FILES > SHA256SUMS && cat SHA256SUMS)
          du -sh "$dist" "$WORK/dist/sources"

      - name: Upload the image
        if: success() && matrix.upload_image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          path: ${{ env.WORK }}/dist/${{ matrix.artifact }}

      - name: Upload the sources of the image
        if: success() && matrix.upload_image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-sources
          retention-days: 7
          compression-level: 0
          path: ${{ env.WORK }}/dist/sources

      # A build step that ran out of time can leave its container running.
      - name: Stop the build containers
        if: always()
        run: docker ps -q | xargs -r docker kill > /dev/null

      # A new base is packed when this run built one: from cold, from a
      # partial base, or on top of an older base that is now too old. A
      # build that failed or ran out of time leaves a partial base, so the
      # next run goes on from there instead of from zero.
      - name: Pack the base
        id: pack
        if: >-
          ${{ !cancelled() && steps.base.outputs.state != 'complete' && steps.base.outputs.state != 'older'
          && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        env:
          COMPLETE: ${{ steps.build.outcome == 'success' }}
          BASE: ${{ steps.keys.outputs.base }}
          PARTIAL: ${{ steps.keys.outputs.partial }}
        run: |
          start=$(date +%s)
          if [ "$COMPLETE" = true ]; then
            # Object files and CMake build trees of installed packages are
            # not read again; a -rebuild of such a package compiles from
            # scratch. legal-info and images are made again by every build.
            sudo find "$OUT_DIR/build" -mindepth 1 -maxdepth 1 -type d | while read -r d; do
              if ls "$d"/.stamp_*installed > /dev/null 2>&1; then
                sudo rm -rf "$d/buildroot-build"
                sudo find "$d" -type f \( -name '*.o' -o -name '*.lo' \) -delete
              fi
            done
            sudo rm -rf "$OUT_DIR/legal-info" "$OUT_DIR/images"
            echo "name=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "name=$PARTIAL" >> "$GITHUB_OUTPUT"
          fi
          rm -rf "$WORK/pack" && mkdir -p "$WORK/pack"
          sudo du -sh "$OUT_DIR" "$WORK/neptron-br-ccache"
          sudo tar --numeric-owner -C "$OUT_DIR" -cf - . | zstd -T0 -3 -q -o "$WORK/pack/out.tar.zst"
          sudo tar --numeric-owner -C "$WORK/neptron-br-ccache" -cf - . | zstd -T0 -3 -q -o "$WORK/pack/ccache.tar.zst"
          ls -l "$WORK/pack"
          echo "Packed in $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the base
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pack.outputs.name }}
          retention-days: 30
          compression-level: 0
          path: ${{ env.WORK }}/pack

      - name: Save the Buildroot downloads
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.dl.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WORK }}/neptron-br-dl
          key: ${{ steps.keys.outputs.dl }}

      # OP-070: the release kernel applies the 15 kHz patch set, whose
      # licence is not clear. The nightly run checks that the pinned patches
      # still apply, that the kernel builds and that the image boots. This
      # build stays on the runner: no step after this one may upload or cache
      # anything. It comes after the base is packed, so the base never holds
      # the patched kernel.
      - name: Check the 15 kHz kernel patch set (nothing is uploaded)
        if: >-
          ${{ success() && matrix.name == 'x86_64'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          cargo xtask os build --arch x86_64 --output x86_64 --jobs "$(nproc)" -- linux-dirclean
          NEPTRON_OS_IMAGES="$HOME/.cache/neptron/buildroot/images/x86_64" \
            cargo xtask os boot-check --arch x86_64 --firmware bios
          rm -rf "$HOME/.cache/neptron/buildroot/images/x86_64" target/os/boot-check
