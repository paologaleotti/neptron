# The OS images and the tier 3 checks in QEMU.
#
# ci.yml calls this workflow for every event. A pull request runs it only
# when it changes the OS, the device crates or this workflow. docs/ci.md
# describes the design, the measured times and the limits.
#
# Licence rules that this workflow enforces:
# - ADR 0018 (OP-070 closed): the 15 kHz kernel patch set is GPL-2.0-only.
#   The PC image applies it, at the commit that the PC defconfig pins. The
#   aarch64 and Pi defconfigs name no kernel patch (the Pi build fails when
#   one is set). The step "Check the kernel patches of the output" proves,
#   on each output before any upload, cache or base, that the kernel
#   applied exactly the patches that the defconfig and fragments of the
#   target name.
# - The sources archive goes with every uploaded image, with the same
#   retention: the legal-info sources (the kernel archive, its patches and
#   series among them), the Buildroot release of the Dockerfile, the
#   NEPTRON tree at the commit (which holds os/, the br2-external tree) and
#   the vendored Rust crates of the build.
# - ADR 0019: the images hold FinalBurn Neo, Snes9x and Genesis Plus GX
#   (non-commercial licences), so an image may not be sold. An uploaded
#   image carries the licence manifest, the licence texts and LICENCES.txt
#   of its own boot partition.
# - An uploaded image is the file that the checks ran on (its SHA-256 is
#   recorded after the build and checked before the upload), and it is the
#   release variant (.github/check-release-variant.sh).
# - release.yml calls this workflow with release: true for a version tag.
#   Each uploaded image then also becomes the release assets: the
#   compressed image and its sources archive, named by
#   `cargo xtask release-names`.

name: Images

on:
  workflow_call:
    inputs:
      release:
        description: Make the assets of the GitHub Release of the tag
        type: boolean
        default: false
  workflow_dispatch:

permissions: {}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Change this value to force a cold Buildroot build of every target.
  BASE_EPOCH: "1"
  # The layout of the base artifact. A new value makes every job ignore the
  # bases of the old layout, also as an older base for a pull request.
  BASE_FORMAT: "2"
  # Every Buildroot data directory lives here, outside the Docker data root,
  # so the runner user can cache it and tar it.
  WORK: /mnt/neptron

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find changed paths
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            device:
              - 'os/**'
              - 'Dockerfile'
              - '.github/image-targets.json'
              - '.github/check-pi-image.sh'
              - '.github/check-release-variant.sh'
              - '.github/workflows/images.yml'
              - 'xtask/src/os.rs'
              - 'xtask/src/os/**'
              - 'apps/neptron-launch/**'
              - 'crates/neptron-kms/**'
              - 'crates/neptron-gfx/**'
              - 'crates/neptron-input/**'
              - 'crates/neptron-audio/**'
              - 'crates/neptron-libretro/**'
              - 'crates/neptron-libretro-sys/**'
      - name: Decide the targets
        id: decide
        env:
          DEVICE: ${{ steps.changes.outputs.device }}
          EVENT: ${{ github.event_name }}
          WANTED: ${{ github.event.inputs.images }}
        run: |
          matrix=$(jq -c '{include: [.targets[] | select(.enabled)]}' .github/image-targets.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = pull_request ] && [ "$DEVICE" != true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change to the OS or the device crates: no image build." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$WANTED" = false ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The manual run asked for no image build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: image ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Runs of main and the nightly run wait for each other per target, so a
    # second cold build never starts while the first one is still running.
    concurrency:
      group: image-${{ matrix.name }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGES: ${{ format('{0}/.cache/neptron/buildroot/images/{1}', '/home/runner', matrix.images_dir) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history gives each file of os/ the time of its last
          # commit, see "Give os/ its commit times".
          fetch-depth: 0

      - name: Show the runner
        run: |
          nproc; free -g; df -h; uname -a
          ls -l /dev/kvm || echo "no /dev/kvm"

      # The runner image holds about 30 GB of SDKs that this job never uses.
      # They are deleted in the background while the job installs its tools.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /opt/az \
            /usr/local/julia* /usr/lib/jvm /opt/microsoft /opt/google &
          docker image prune --all --force > /dev/null &
          wait
          if ! mountpoint -q /mnt || [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -lt 50 ]; then
            echo "WORK=/home/runner/neptron-work" >> "$GITHUB_ENV"
          fi
          df -h

      - name: Install QEMU and enable KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            qemu-system-x86 qemu-system-arm qemu-utils ovmf zstd mtools
          # QEMU looks for the EDK II flash images under their QEMU names;
          # Ubuntu ships them as OVMF files.
          if [ ! -e /usr/share/qemu/edk2-x86_64-code.fd ] && [ -e /usr/share/OVMF/OVMF_CODE_4M.fd ]; then
            sudo ln -s /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/qemu/edk2-x86_64-code.fd
            sudo ln -s /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/qemu/edk2-i386-vars.fd
          fi
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "no KVM: QEMU emulates the CPU"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Make compares the stamps of the restored output with the files of
      # os/ (kernel and BusyBox fragments). A fresh checkout gives every file
      # the current time, which would rebuild the kernel each run. The time
      # of the last commit of each file keeps a file that did not change
      # older than the stamps, and a file that changed newer.
      - name: Give os/ its commit times
        run: |
          git log --format='@%ct' --name-only -- os | awk '
            /^@/ { t = substr($0, 2); next }
            NF && !($0 in seen) { seen[$0] = t; print t, $0 }' |
          while read -r t f; do
            if [ -e "$f" ]; then touch -m -d "@$t" "$f"; fi
          done

      - name: Compute the cache keys
        id: keys
        env:
          DEFCONFIG: ${{ matrix.defconfig }}
          FRAGMENTS: ${{ join(matrix.fragments, ' ') }}
          BASE_PATHS: ${{ join(matrix.base_paths, ' ') }}
          TARGET: ${{ matrix.name }}
        run: |
          files="Dockerfile os/configs/$DEFCONFIG"
          for f in $FRAGMENTS; do files="$files os/configs/$f"; done
          # shellcheck disable=SC2086
          files="$files $(git ls-files -- $BASE_PATHS | tr '\n' ' ')"
          base=$({ echo "$BASE_EPOCH"; for f in $files; do echo "$f"; sha256sum < "$f"; done; } \
            | sha256sum | cut -c1-16)
          dl=$(git ls-files '*.hash' 'os/configs/*' Dockerfile | xargs sha256sum | sha256sum | cut -c1-16)
          echo "base=br-base-v$BASE_FORMAT-$TARGET-$base" >> "$GITHUB_OUTPUT"
          echo "partial=br-partial-v$BASE_FORMAT-$TARGET-$base" >> "$GITHUB_OUTPUT"
          echo "prefix=br-base-v$BASE_FORMAT-$TARGET-" >> "$GITHUB_OUTPUT"
          echo "dl=br-dl-$TARGET-$dl" >> "$GITHUB_OUTPUT"
          echo "Base key: br-base-v$BASE_FORMAT-$TARGET-$base, from: $files"

      - name: Make the Docker volumes
        env:
          TARGET: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
          BUILD_ARGS: ${{ join(matrix.build_args, ' ') }}
        run: |
          # The output volume is the --output name, or the arch.
          out=$(echo " $BUILD_ARGS " | sed -n 's/.* --output \([^ ]*\) .*/\1/p')
          out=${out:-$ARCH}
          echo "OUT_VOLUME=neptron-br-out-$out" >> "$GITHUB_ENV"
          sudo mkdir -p "$WORK"
          sudo chown "$(id -u):$(id -g)" "$WORK"
          for v in neptron-br-dl neptron-br-ccache "neptron-br-out-$out" "neptron-cross-$ARCH"; do
            mkdir -p "$WORK/$v"
            docker volume create --driver local --opt type=none --opt o=bind \
              --opt device="$WORK/$v" "$v" > /dev/null
          done
          echo "OUT_DIR=$WORK/neptron-br-out-$out" >> "$GITHUB_ENV"

      - name: Restore the Buildroot downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dl
        with:
          path: ${{ env.WORK }}/neptron-br-dl
          key: ${{ steps.keys.outputs.dl }}
          restore-keys: br-dl-${{ matrix.name }}-

      # The base is the Buildroot output of a full build for this key: the
      # toolchain, LLVM, Mesa, the kernel and every other package, with the
      # object files removed. It is a workflow artifact, because it is larger
      # than the Actions cache of the repository can hold beside the Cargo
      # caches. Only artifacts of this repository are trusted: a fork can
      # upload an artifact with any name, but only a writer can push a branch
      # here. A base with the exact key of this run is taken from any branch
      # of the repository: the key hashes every input of the base, so the
      # first run of main after a merge finds the base that the branch built.
      # An older base, built from other inputs, comes from main or from this
      # branch only.
      - name: Find the base
        id: base
        env:
          BASE: ${{ steps.keys.outputs.base }}
          PARTIAL: ${{ steps.keys.outputs.partial }}
          PREFIX: ${{ steps.keys.outputs.prefix }}
          REPO_ID: ${{ github.repository_id }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          # newest QUERY PREFIX BRANCHES: BRANCHES is "any" or "own".
          newest() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100$1" --jq "
              .artifacts[]
              | select(.expired | not)
              | select(.workflow_run.head_repository_id == $REPO_ID)
              | select(\"$3\" == \"any\" or .workflow_run.head_branch == \"main\" or .workflow_run.head_branch == \"$BRANCH\")
              | select(.name | startswith(\"$2\"))
              | \"\(.created_at) \(.workflow_run.id) \(.name)\"" | sort -r | head -n 1
          }
          state=cold
          found=$(newest "&name=$BASE" "$BASE" any)
          if [ -n "$found" ]; then
            state=complete
          else
            found=$(newest "&name=$PARTIAL" "$PARTIAL" any)
            if [ -n "$found" ]; then
              state=partial
            else
              # An older base: on a pull request it is built on further,
              # which is quick but not clean. Elsewhere only its compiler
              # cache is used, and the build is cold.
              found=$(newest "" "$PREFIX" own)
              if [ -n "$found" ]; then
                if [ "$EVENT" = pull_request ]; then state=older; else state=ccache; fi
              fi
            fi
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ -n "$found" ]; then
            set -- $found
            echo "run=$2" >> "$GITHUB_OUTPUT"
            echo "name=$3" >> "$GITHUB_OUTPUT"
          fi
          echo "Base: $state ${found:-none}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the base
        if: steps.base.outputs.name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.base.outputs.name }}
          run-id: ${{ steps.base.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ env.WORK }}/base

      - name: Unpack the base
        if: steps.base.outputs.name != ''
        env:
          STATE: ${{ steps.base.outputs.state }}
        run: |
          start=$(date +%s)
          ls -l "$WORK/base"
          if [ -f "$WORK/base/ccache.tar.zst" ]; then
            zstd -dc "$WORK/base/ccache.tar.zst" | sudo tar --numeric-owner -xpf - -C "$WORK/neptron-br-ccache"
          fi
          if [ "$STATE" != ccache ]; then
            zstd -dc "$WORK/base/out.tar.zst" | sudo tar --numeric-owner -xpf - -C "$OUT_DIR"
            # The base holds no images/. Without these stamps the kernel and
            # the boot loaders install their files there again.
            sudo find "$OUT_DIR/build" -mindepth 2 -maxdepth 2 -name .stamp_images_installed -delete
            # The output says every package is downloaded, so Buildroot never
            # fetches those archives again, but make legal-info copies them.
            if [ -f "$WORK/base/dl.tar" ]; then
              sudo tar --numeric-owner --skip-old-files -xpf "$WORK/base/dl.tar" -C "$WORK/neptron-br-dl"
            fi
          fi
          rm -rf "$WORK/base"
          echo "Unpacked in $(( $(date +%s) - start )) s"
          df -h "$WORK"

      # The container user br has uid 1000 and the runner user does not. A
      # bind volume keeps the owner of the host directory, the cache restores
      # files as the runner user, and the last step of os build copies the
      # images as br into a directory of the host.
      - name: Give the volumes to the container user
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          for v in neptron-br-dl neptron-br-ccache "$(basename "$OUT_DIR")" "neptron-cross-$ARCH"; do
            sudo chown -R 1000:1000 "$WORK/$v"
          done
          mkdir -p "$IMAGES"
          sudo chown 1000:1000 "$IMAGES"

      # The NEPTRON packages build this checkout. Buildroot does not see a
      # change to a local source by itself, so they are built again every
      # time. -reconfigure, not -rebuild: the configure step runs cargo
      # vendor, and a Cargo.lock with a new crate fails the offline build
      # with the old vendor directory. "source" fetches the archives of new
      # packages before make legal-info copies them.
      - name: Build the image
        id: build
        timeout-minutes: ${{ matrix.build_minutes }}
        env:
          BUILD_ARGS: ${{ join(matrix.build_args, ' ') }}
          REBUILD: ${{ join(matrix.rebuild, '-reconfigure ') }}
        run: |
          start=$(date +%s)
          # shellcheck disable=SC2086
          cargo xtask os build $BUILD_ARGS --jobs "$(nproc)" -- source $REBUILD-reconfigure
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          echo "Image build: $(( $(date +%s) - start )) s (base: ${{ steps.base.outputs.state }})" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The checks below boot copies or snapshots of the image. The upload
      # checks these sums, so the file that goes out is the file that the
      # checks ran on.
      - name: Record the checksums of the built images
        if: steps.build.outcome == 'success' && matrix.upload_image
        env:
          FILES: ${{ join(matrix.image_files, ' ') }}
        run: |
          mkdir -p "$WORK/dist"
          (cd "$IMAGES" && sha256sum $FILES) | tee "$WORK/dist/built.sha256"

      # ADR 0018. Every later step that uploads or caches the output, the
      # image or the base runs only after this step passed. The configuration
      # of the output must name the kernel patches that the defconfig and the
      # fragments of the target name (the last line wins, as in a merge), or
      # none. A kernel that applied a 15 kHz patch when the target names none
      # fails. A build that failed can leave no list of applied patches, so
      # a missing list passes; the base of such a build still gets the
      # configuration check.
      - name: Check the kernel patches of the output
        id: patches
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        env:
          DEFCONFIG: ${{ matrix.defconfig }}
          FRAGMENTS: ${{ join(matrix.fragments, ' ') }}
        run: |
          files="os/configs/$DEFCONFIG"
          for f in $FRAGMENTS; do files="$files os/configs/$f"; done
          # shellcheck disable=SC2086
          want=$(cat $files | grep '^BR2_LINUX_KERNEL_PATCH=' | tail -n 1)
          want=${want:-BR2_LINUX_KERNEL_PATCH=\"\"}
          got=$(sudo grep '^BR2_LINUX_KERNEL_PATCH=' "$OUT_DIR/.config" || true)
          if [ "$got" != "$want" ]; then
            echo "The output names other kernel patches than the target:"
            echo "want: $want"
            echo "got:  $got"
            exit 1
          fi
          if [ "$want" = 'BR2_LINUX_KERNEL_PATCH=""' ]; then
            for list in "$OUT_DIR"/build/linux-*/.applied_patches_list; do
              [ -e "$list" ] || continue
              if sudo grep -i '15khz' "$list"; then
                echo "The kernel in $list has a 15 kHz patch the target does not name"
                exit 1
              fi
            done
          fi
          echo "Kernel patches as the target names them: ${want#BR2_LINUX_KERNEL_PATCH=}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Show the output sizes
        if: ${{ !cancelled() }}
        run: |
          df -h "$WORK"
          sudo du -sh "$OUT_DIR"/* "$WORK"/neptron-br-dl "$WORK"/neptron-br-ccache 2>/dev/null || true
          sudo du -s "$OUT_DIR"/build/* 2>/dev/null | sort -rn | head -25 || true
          ls -l "$IMAGES" || true

      - name: Check the boot with BIOS
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'boot-bios') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: cargo xtask os boot-check --arch ${{ matrix.arch }} --firmware bios

      - name: Check the boot with UEFI
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'boot-uefi') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: cargo xtask os boot-check --arch ${{ matrix.arch }} --firmware uefi

      - name: Check the boot
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'boot') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: cargo xtask os boot-check --arch ${{ matrix.arch }}

      - name: Check the frontend for the guest
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'app') }}
        run: cargo xtask os app-check --arch ${{ matrix.arch }}

      # kms-check, gles-compare, selftest-check and core-trace make an export
      # directory under target/ as the runner user, then copy the program
      # into it as the container user br (uid 1000). umask 0000 makes that
      # directory writable for br.
      - name: Check KMS on vkms
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'kms') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: umask 0000 && cargo xtask kms-check --arch ${{ matrix.arch }}

      - name: Compare the GLES renderer
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'gles') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: umask 0000 && cargo xtask gles-compare --arch ${{ matrix.arch }}

      - name: Check the video self-test
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'selftest') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: umask 0000 && cargo xtask os selftest-check --arch ${{ matrix.arch }}

      # The SNES and Mega Drive test ROMs are not in the repository (OP-053),
      # and CI never downloads a ROM. Their cases are reported as skipped;
      # every case whose ROM is here must pass.
      - name: Trace the real cores
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'core') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: umask 0000 && cargo xtask core-trace --arch ${{ matrix.arch }} --allow-missing-roms

      - name: Check the share partition
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'share') }}
        env:
          NEPTRON_OS_IMAGES: ${{ env.IMAGES }}
        run: cargo xtask os share-check --arch ${{ matrix.arch }}

      # QEMU does not boot the Pi image. The build ran its kernel checks
      # (check-kernel-config.sh, check-kernel-patches.sh); this checks the
      # layout of the SD card image that post-image.sh wrote.
      - name: Check the layout of the Pi image
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.checks, 'pi-layout') }}
        run: .github/check-pi-image.sh "$IMAGES/neptron-rpi-arm64.img"

      - name: Upload the check reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            target/os/boot-check
            target/core-trace/actual
            target/qemu/*-console.log

      # The image that goes out is the release variant, and for a release
      # it names the tag and exactly the commit of the tag.
      - name: Check the release variant
        if: success() && matrix.upload_image
        env:
          IMAGE: ${{ matrix.image_files[0] }}
          TAG: ${{ inputs.release && github.ref_name || '' }}
        run: |
          sha=
          [ -n "$TAG" ] && sha=$(git rev-parse HEAD)
          .github/check-release-variant.sh "$IMAGES/$IMAGE" "$OUT_DIR" $TAG $sha

      - name: Collect the image, its checksum, the licences and the sources
        if: success() && matrix.upload_image
        env:
          FILES: ${{ join(matrix.image_files, ' ') }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          head=$(git rev-parse HEAD)
          dist="$WORK/dist/$ARTIFACT"
          src="$WORK/dist/$ARTIFACT-sources"
          mkdir -p "$dist/legal" "$src/legal-info"
          (cd "$IMAGES" && sha256sum -c "$WORK/dist/built.sha256")
          for f in $FILES; do cp "$IMAGES/$f" "$dist/"; done
          sudo cp "$OUT_DIR"/legal-info/*.csv "$OUT_DIR"/legal-info/*.txt "$dist/legal/" 2>/dev/null || true
          sudo cp -r "$OUT_DIR/legal-info/licenses" "$dist/legal/"
          cp -r "$IMAGES/boot-part/legal/neptron-rust" "$dist/legal/"
          cp "$IMAGES/boot-part/LICENCES.txt" "$dist/LICENCES.txt"

          # The sources archive: everything needed to build the image again.
          sudo cp -r "$OUT_DIR/legal-info/sources" "$OUT_DIR/legal-info/manifest.csv" \
            "$OUT_DIR/legal-info/README" "$src/legal-info/"
          br_version=$(sed -n 's/^ARG BUILDROOT_VERSION=//p' Dockerfile)
          br_sha256=$(sed -n 's/^ARG BUILDROOT_SHA256=//p' Dockerfile)
          br="$src/buildroot-$br_version.tar.gz"
          curl -fsSL --retry 3 -o "$br" "https://buildroot.org/downloads/buildroot-$br_version.tar.gz"
          echo "$br_sha256  $br" | sha256sum -c -
          # No image holds the GPL test ROM (tests/roms/README.md); the
          # archive leaves it out, so it gives out no binary without source.
          git archive --format=tar --prefix="neptron-$head/" HEAD -- . ':(exclude)tests/roms/nes' \
            | xz -T0 -6 > "$src/neptron-$head.tar.xz"
          vendor=$(sudo sh -c 'ls -d "$1"/build/neptron-[0-9]*/VENDOR' sh "$OUT_DIR")
          [ "$(echo "$vendor" | wc -l)" = 1 ] || { echo "not one vendor folder: $vendor"; exit 1; }
          sudo tar -C "${vendor%/VENDOR}" -cf - VENDOR .cargo/config.toml \
            | xz -T0 -6 > "$src/neptron-$head-vendor.tar.xz"
          cat > "$src/README.txt" <<EOF
          The source code of NEPTRON $ARTIFACT ($FILES), commit $head,
          CI run $GITHUB_RUN_ID. LICENCES.txt of the image names the same commit.

          - legal-info/: the output of make legal-info of the build. sources/
            holds the source archive of each package that Buildroot gives out,
            with the patches that the build applies and their order (series);
            the kernel, with the 15 kHz patch set of the PC image, is in
            sources/linux-*. manifest.csv lists every package, its version and
            its licence.
          - buildroot-$br_version.tar.gz: Buildroot $br_version, the build system
            (https://buildroot.org/downloads/, SHA-256 $br_sha256).
          - neptron-$head.tar.xz: the NEPTRON tree at that commit: the
            programs, os/ (the br2-external tree: defconfigs, board files and
            scripts, package files, kernel configuration fragments), the
            Dockerfile of the build container and xtask, which runs the build.
            tests/roms/nes is left out: no image holds the test ROM.
          - neptron-$head-vendor.tar.xz: the Rust crates that the build took
            from crates.io for Cargo.lock (VENDOR/), and the Cargo settings
            that use them (.cargo/config.toml).

          To build the image again, unpack the NEPTRON tree and run
          cargo xtask os build --arch ARCH in it, as os/README.md describes.
          It builds the container of the Dockerfile, which runs this Buildroot
          release, and Buildroot downloads the package archives that
          legal-info/sources holds, checked against the hash files.
          EOF
          sudo chown -R "$(id -u):$(id -g)" "$WORK/dist"
          (cd "$WORK/dist" && tar -cf "$ARTIFACT-sources.tar" "$ARTIFACT-sources" && rm -rf "$ARTIFACT-sources")

          cat > "$dist/README.txt" <<EOF
          NEPTRON $ARTIFACT, commit $head, CI run $GITHUB_RUN_ID.
          LICENCES.txt (also on the boot partition of the image) names the
          commit, the licences, the kernel and its patches. The image holds
          FinalBurn Neo, Snes9x and Genesis Plus GX, which may not be sold or
          used commercially, so this image may not be sold. Every other
          program keeps its own licence. legal/ holds the licence manifest,
          the licence texts and the notices of the Rust crates. The source
          code is the artifact $ARTIFACT-sources of the same run
          ($ARTIFACT-sources.tar). Give it out with the image.
          EOF
          (cd "$dist" && sha256sum $FILES > SHA256SUMS && cat SHA256SUMS)
          du -sh "$dist" "$WORK/dist/$ARTIFACT-sources.tar"
          ls -l "$WORK/dist/$ARTIFACT-sources.tar" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the image
        if: success() && matrix.upload_image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          path: ${{ env.WORK }}/dist/${{ matrix.artifact }}

      - name: Upload the sources of the image
        if: success() && matrix.upload_image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-sources
          retention-days: 7
          compression-level: 0
          path: ${{ env.WORK }}/dist/${{ matrix.artifact }}-sources.tar

      # For a release: the compressed image and its sources archive under
      # the names of release-names, and a line with the SHA-256 of the image
      # that the checks ran on, for the release notes. A release asset must
      # be smaller than 2 GiB.
      - name: Make the release assets
        if: success() && matrix.upload_image && inputs.release
        env:
          FILES: ${{ join(matrix.image_files, ' ') }}
          ARTIFACT: ${{ matrix.artifact }}
          TAG: ${{ github.ref_name }}
        run: |
          set -- $FILES
          if [ $# != 1 ]; then
            echo "A release target has one image file, not: $FILES"
            exit 1
          fi
          names=$(cargo xtask release-names --tag "$TAG" --artifact "$ARTIFACT" --image "$1")
          image=$(echo "$names" | sed -n 's/^image=//p')
          sources=$(echo "$names" | sed -n 's/^sources=//p')
          rel="$WORK/release"
          mkdir -p "$rel"
          xz -T0 -6 -c "$WORK/dist/$ARTIFACT/$1" > "$rel/$image"
          mv "$WORK/dist/$ARTIFACT-sources.tar" "$rel/$sources"
          raw=$(cd "$WORK/dist/$ARTIFACT" && sha256sum "$1" | cut -d' ' -f1)
          echo "- $image: $1, SHA-256 $raw" > "$rel/$ARTIFACT.notes"
          for f in "$rel/$image" "$rel/$sources"; do
            size=$(stat -c %s "$f")
            if [ "$size" -ge 2147483648 ]; then
              echo "$f has $size bytes; a release asset must be smaller than 2 GiB"
              exit 1
            fi
          done
          ls -l "$rel" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the release assets
        if: success() && matrix.upload_image && inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          retention-days: 7
          compression-level: 0
          path: ${{ env.WORK }}/release

      # A build step that ran out of time can leave its container running.
      - name: Stop the build containers
        if: always()
        run: docker ps -q | xargs -r docker kill > /dev/null

      # A new base is packed when this run built one: from cold, from a
      # partial base, or on top of an older base that is now too old. A
      # build that failed or ran out of time leaves a partial base, so the
      # next run goes on from there instead of from zero.
      - name: Pack the base
        id: pack
        if: >-
          ${{ !cancelled() && steps.base.outputs.state != 'complete' && steps.base.outputs.state != 'older'
          && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
          && steps.patches.outcome == 'success' }}
        env:
          COMPLETE: ${{ steps.build.outcome == 'success' }}
          BASE: ${{ steps.keys.outputs.base }}
          PARTIAL: ${{ steps.keys.outputs.partial }}
        run: |
          start=$(date +%s)
          if [ "$COMPLETE" = true ]; then
            # Object files and CMake build trees of installed packages are
            # not read again; a -rebuild of such a package compiles from
            # scratch. legal-info and images are made again by every build.
            sudo find "$OUT_DIR/build" -mindepth 1 -maxdepth 1 -type d | while read -r d; do
              if ls "$d"/.stamp_*installed > /dev/null 2>&1; then
                sudo rm -rf "$d/buildroot-build"
                sudo find "$d" -type f \( -name '*.o' -o -name '*.lo' \) -delete
              fi
            done
            sudo rm -rf "$OUT_DIR/legal-info" "$OUT_DIR/images"
            echo "name=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "name=$PARTIAL" >> "$GITHUB_OUTPUT"
          fi
          rm -rf "$WORK/pack" && mkdir -p "$WORK/pack"
          sudo du -sh "$OUT_DIR" "$WORK/neptron-br-ccache"
          sudo tar --numeric-owner -C "$OUT_DIR" -cf - . | zstd -T0 -3 -q -o "$WORK/pack/out.tar.zst"
          sudo tar --numeric-owner -C "$WORK/neptron-br-ccache" -cf - . | zstd -T0 -3 -q -o "$WORK/pack/ccache.tar.zst"
          # The archives are compressed already.
          sudo tar --numeric-owner -C "$WORK/neptron-br-dl" -cf "$WORK/pack/dl.tar" .
          sudo chown "$(id -u):$(id -g)" "$WORK/pack/dl.tar"
          ls -l "$WORK/pack"
          echo "Packed in $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the base
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pack.outputs.name }}
          retention-days: 30
          compression-level: 0
          path: ${{ env.WORK }}/pack

      - name: Save the Buildroot downloads
        if: >-
          ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.dl.outputs.cache-hit != 'true'
          && steps.patches.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WORK }}/neptron-br-dl
          key: ${{ steps.keys.outputs.dl }}
