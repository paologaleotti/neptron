# NEPTRON GPU capability table. data/hardware/README.md describes the
# format, the match rules and the source of each value.
#
# A GPU that matches no entry gets the unknown-GPU values that
# neptron-platform holds as constants: 25 MHz lowest pixel clock, no
# interlace. Where the hardware support matrix says that a capability is
# not proven, the entry leaves it off and names it in a quirk.

version = 1

[[gpu]]
id = "intel_gen9"
name = "Intel gen9 (Skylake, Kaby Lake, Amber Lake, Coffee Lake), onboard VGA or DP to VGA"
tier = 1
driver = "i915"
pci_vendor = 0x8086
pci_devices = [
    # Skylake
    0x1902, 0x1906, 0x190a, 0x190b, 0x190e, 0x1912, 0x1913, 0x1915,
    0x1916, 0x1917, 0x191a, 0x191b, 0x191d, 0x191e, 0x1921, 0x1923,
    0x1926, 0x1927, 0x192a, 0x192b, 0x192d, 0x1932, 0x193a, 0x193b,
    0x193d,
    # Kaby Lake
    0x5902, 0x5906, 0x5908, 0x590a, 0x590b, 0x590e, 0x5912, 0x5913,
    0x5915, 0x5916, 0x5917, 0x591a, 0x591b, 0x591c, 0x591d, 0x591e,
    0x5921, 0x5923, 0x5926, 0x5927, 0x593b,
    # Amber Lake
    0x87c0, 0x87ca,
    # Coffee Lake
    0x3e90, 0x3e91, 0x3e92, 0x3e93, 0x3e94, 0x3e96, 0x3e98, 0x3e99,
    0x3e9a, 0x3e9b, 0x3e9c, 0x3ea5, 0x3ea6, 0x3ea7, 0x3ea8, 0x3ea9,
]
pclock_min_hz = 25_000_000
pclock_max_hz = 165_000_000
interlace = false
flip_per_field = false
max_width = 1920
max_height = 1200
quirks = ["low_pixel_clock_unproven", "interlace_unproven", "interlace_needs_linear_scanout"]

# The limits of a flat panel on the digital outputs of the HD 530 class.
# A CRT, also one behind a DP-to-VGA DAC, keeps the values above.
# HDMI 1.4 and DVI-D: i915 sets a TMDS clock limit of 300 MHz below
# display version 10 (intel_hdmi_source_max_tmds_clock), so no 4K at
# 60 Hz on HDMI. Size: Intel ARK, HD Graphics 530, 4096x2304 at 24 Hz on
# HDMI; 4096x2160 is the cap here, the DCI 4K size.
[[gpu.panel]]
connectors = ["HDMI-A", "DVI-D"]
pclock_max_hz = 300_000_000
max_width = 4_096
max_height = 2_160

# DisplayPort 1.2 (HBR2, 4 lanes): Intel ARK, HD Graphics 530, 4096x2304
# at 60 Hz on DP. 533.25 MHz is 3840x2160 at 60 Hz with CVT reduced
# blanking, the timing that 4K DP monitors list. The CTA-861 timing of
# 594 MHz stays out.
[[gpu.panel]]
connectors = ["DP"]
pclock_max_hz = 533_250_000
max_width = 4_096
max_height = 2_160

