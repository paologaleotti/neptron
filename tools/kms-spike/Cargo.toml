[package]
name = "kms-spike"
description = "Standalone hardware spike (WP 1.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The crate code is MIT OR Apache-2.0; the embedded presets of data/monitors are GPL-2.0-or-later.
license = "(MIT OR Apache-2.0) AND GPL-2.0-or-later"
publish.workspace = true

[features]
# Off by default: the headless build (T0 to T2) compiles no SDL3, EGL or KMS code.
kms = ["dep:drm"]

[dependencies]
neptron-safety = { path = "../../crates/neptron-safety" }
neptron-types = { path = "../../crates/neptron-types" }

[target.'cfg(target_os = "linux")'.dependencies]
drm = { workspace = true, optional = true }

[build-dependencies]
neptron-types = { path = "../../crates/neptron-types" }
toml.workspace = true

[lints]
workspace = true
