# The task board of NEPTRON. Run rule 22 of CLAUDE.md is the authority.
#
# [[release]]  version, state: "released" (with its tag), "current" (exactly one) or "planned".
# [[task]]     release:  the release that holds the task, or "later" for work with no release yet.
#                        A released version holds no open task: at a tag, an open task moves
#                        to the current release or to "later".
#              priority: only on an open task of the current release, 1 first. The owner sets the order.
#              status:   pending, in_progress, merged or dropped.
#              id:       a new task is "T" and three digits, in one sequence from T101. An id never
#                        changes: it is in commits, specs and open points. The older prefixes
#                        (T01 to T29, C, CI, D, P, M, N, S, R) are history and mean nothing now.
#              wave:     the build order of the past. Nothing reads it.

[[release]]
version = "0.1"
state = "released"
tag = "v0.1.1"

[[release]]
version = "0.2"
state = "current"

[[release]]
version = "0.3"
state = "planned"

